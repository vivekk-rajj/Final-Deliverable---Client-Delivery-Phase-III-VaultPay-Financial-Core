<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VaultPay Client</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-header">
      <div>
        <div class="eyebrow">Client Portal</div>
        <h1>My Invoices</h1>
      </div>
      <button id="logoutBtn" class="ghost">Logout</button>
    </div>

    <main class="dashboard-shell">
      <section class="stats-grid" id="clientSummary"></section>
      <section class="panel">
        <h2>Invoice History</h2>
        <div id="clientInvoices" class="invoice-list"></div>
      </section>
    </main>

    <script src="/app.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const role = localStorage.getItem('vaultpay_role');
        if (role !== 'client') {
          window.location.href = '/forbidden';
          return;
        }
        window.VaultPayClient.init();
      });
    </script>
  </body>
</html>
